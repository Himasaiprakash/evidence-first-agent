version: '3.8'

services:
  api:
    build: .
    container_name: evidence_agent_api
    ports:
      - "8010:8010"
    environment:
      - POSTGRES_URL=postgresql://agent_user:agent_password@postgres:5432/evidence_db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_AUTH=neo4j/agent_password
      - QDRANT_URL=http://qdrant:6333
      - OPENSEARCH_URL=http://opensearch:9200
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - neo4j
      - qdrant
      - opensearch
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: evidence_agent_postgres
    environment:
      POSTGRES_USER: agent_user
      POSTGRES_PASSWORD: agent_password
      POSTGRES_DB: evidence_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5.18.0
    container_name: evidence_agent_neo4j
    environment:
      NEO4J_AUTH: neo4j/agent_password
      NEO4J_PLUGINS: '["graph-data-science", "apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  qdrant:
    image: qdrant/qdrant:v1.8.0
    container_name: evidence_agent_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: evidence_agent_opensearch
    environment:
      - discovery.type=single-node
      - "DISABLE_SECURITY_PLUGIN=true"
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  redis:
    image: redis:7-alpine
    container_name: evidence_agent_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  neo4j_data:
  qdrant_data:
  opensearch_data:
